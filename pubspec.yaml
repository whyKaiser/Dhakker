name: dhakker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^8.1.2
  flutter_bloc: ^8.1.2
  conditional_builder_null_safety: ^0.0.6
  hexcolor: ^3.0.1
  password_strength_checker: ^1.2.2
  flutter_svg: ^2.0.10+1
  animated_text_kit: ^4.2.2
  image_picker: ^0.8.5+3
  fluttertoast: ^8.2.4
  shared_preferences: ^2.5.3
  styled_text: ^8.1.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1
  flutter_gradient_button: ^0.0.1
  loading_indicator: ^3.1.1
  flutter_launcher_icons: ^0.13.1
  flutter_islamic_icons: ^1.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_switch: ^0.3.2

  # النسخة الجديدة المتوافقة مع إصدار الفلاتر حقك بالملي
  flutter_compass: ^0.8.1

  # مكتبة الأنميشن الرسمية لتأثير تمدد وانفجار الكروت
  animations: ^2.0.11

  # نسخ الفايربيس المستقرة والمتوافقة مع مشروعك
  firebase_auth: ^5.5.0
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.5
  firebase_crashlytics: ^4.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  file_picker: ^8.1.2
  flutter_tts: ^3.4.0
  audioplayers: ^6.1.0
  geolocator: ^13.0.1
  lottie: ^3.1.2
  permission_handler: ^11.3.0
  speech_to_text: ^6.5.0

  # عدّاد الخطى (Step Counter) لحساب مسافة السعي بدقة حتى مع ضعف GPS
  pedometer: ^4.0.2

  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.1
  adhan: ^2.0.0+1
  flutter_local_notifications: ^19.5.0
  qr_flutter: ^4.1.0

  # any: يدع flutter_localizations يختار نسخة intl المثبّتة (تختلف بين إصدارات
  # Flutter) — يمنع فشل حلّ التبعيات على Codemagic الذي يستخدم Flutter أحدث.
  intl: any
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^3.0.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appIcon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: AlamirReg
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf

    - family: AlamirBold
      fonts:
        - asset: assets/fonts/Almarai-Bold.ttf

flutter_intl:
  enabled: true