name: Audio tooling

on:
  push:
    paths:
      - "review/**"
      - "scripts/generate_dua_audio*"
      - "scripts/import_source_pack.mjs"
      - "source_packs/quran_authority_hafs_uthmani.json"
      - "third_party/kfgqpc/**"
      - "package*.json"
      - ".github/workflows/audio-tools.yml"
  pull_request:
    paths:
      - "review/**"
      - "scripts/generate_dua_audio*"
      - "scripts/import_source_pack.mjs"
      - "source_packs/quran_authority_hafs_uthmani.json"
      - "third_party/kfgqpc/**"
      - "package*.json"
      - ".github/workflows/audio-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - name: Install Node tooling
        run: npm ci --no-audit --no-fund
      - name: Ensure local audio processing tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - name: Lint
        run: npm run lint
      - name: Test without production credentials
        run: node --test review/*.test.mjs scripts/generate_dua_audio.test.mjs
