name: Flutter CI

on:
  push:
    branches:
      - "main"
      - "claude/dhakker-context-ai-upgrade-v0ilmk"
      - "claude/moia-umrah-source-pack"
      - "claude/quran-text-authority-u5-u12"
      - "claude/import-staging-guards"
      - "claude/importer-field-schema"
      - "claude/staging-import-workflow"
      - "claude/language-routing-audit"
      - "claude/staging-collection-rules"
      - "claude/human-review-ledger"
      - "claude/usage-qualifier-optional-addition"
      - "claude/content-kind-contextual-evidence"
      - "claude/batch-c-review"
      - "claude/batch-d-review"
      - "claude/batch-e-review"
      - "claude/high-risk-content-audit"
      - "claude/remaining-guidance-review"
      - "claude/guidance-g1-g2-g4-g7"
      - "claude/remaining-general-review"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# This workflow checks out the repository, runs tests, and writes nothing back
# — no comments, no releases, no packages, no deployments. `contents: read` is
# therefore the entire requirement, and declaring it stops the job inheriting
# whatever the repository default happens to be (often read/write).
#
# `pull_request` (not `pull_request_target`) means a fork's run gets no
# secrets, so a PR cannot exfiltrate anything through this file.
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # subosito/flutter-action v2.14.0
      - name: Set up Flutter
        uses: subosito/flutter-action@1c5eb12d812966ca84680edc38353a0851c8fd56
        with:
          flutter-version: "3.24.2"
          channel: "stable"
          cache: true

      # This repo's pre-existing files were never run through `dart format`
      # on a case-sensitive filesystem, so `dart format .` across the whole
      # tree fails on ~60 files unrelated to this feature. Until the whole
      # repo is formatted in its own dedicated change, only check the Dart
      # files this feature fully owns (new files, or files where every line
      # in the diff is this feature's own addition) — this must still fail
      # if any of them is incorrectly formatted. Files where this feature
      # only inserted a small, surgical diff into a pre-existing, not-yet-
      # formatted file (lib/bloc/cubit.dart, home_dua_controller.dart) are
      # deliberately excluded: formatting them would force an unrelated
      # full-file reflow, which is exactly what this check exists to avoid.
      - name: Verify formatting (feature-owned files only)
        run: |
          FEATURE_DART_FILES=(
            "lib/Screens/Assistant/assistant_screen.dart"
            "lib/Screens/Piligram/Duas/widgets/content_kind_card.dart"
            "lib/Screens/Piligram/Home/models/supplication_model.dart"
            "test/content_kind_classification_test.dart"
            "test/source_pack_integrity_test.dart"
            "test/quran_text_authority_test.dart"
            "test/no_bundled_third_party_test.dart"
            "lib/data/offline_knowledge_repository.dart"
            "lib/services/assistant_service.dart"
            "lib/services/language_policy.dart"
            "test/language_policy_test.dart"
            "lib/services/pilgrim_context_builder.dart"
            "test/assistant_response_widget_test.dart"
            "test/assistant_service_test.dart"
            "test/offline_knowledge_repository_test.dart"
            "test/review_ledger_test.dart"
            "test/usage_qualifier_test.dart"
            "test/supplication_writers_test.dart"
            "test/content_kind_batch_b_test.dart"
            "test/quran_authority_coverage_test.dart"
            "test/source_references_test.dart"
            "test/recitation_policy_test.dart"
            "test/safa_trigger_gap_test.dart"
            "test/marwah_relation_test.dart"
            "test/high_risk_content_test.dart"
            "test/guidance_batches_g3_g5_g6_test.dart"
            "test/guidance_batches_g1_g2_g4_test.dart"
            "test/page_97_general_duas_test.dart"
            "test/halq_shamil_citation_test.dart"
            "test/page_98_and_g7_batch_test.dart"
            "test/tamam_umrah_test.dart"
            "test/page_99_test.dart"
            "test/page_100_test.dart"
            "test/page_101_test.dart"
            "test/page_102_test.dart"
            "test/page_64_test.dart"
            "test/takhrij_review_test.dart"
            "lib/Screens/Piligram/Home/services/dua_playback_service.dart"
            "test/dua_playback_fallback_test.dart"
            "lib/boot_signal.dart"
            "lib/boot_signal_stub.dart"
            "lib/boot_signal_web.dart"
          )
          dart format --output=none --set-exit-if-changed "${FEATURE_DART_FILES[@]}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  worker-tests:
    name: Assistant proxy Worker tests
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.0.0 — same commit the credential-bearing
      # workflows already run with `node-version: "20"`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      # Static analysis of every .mjs/.js in the repository's Node code. The
      # config is a correctness net, not a style pass — see eslint.config.mjs
      # for what is deliberately switched off and why.
      - name: Install Node tooling
        run: npm ci --no-audit --no-fund

      - name: Lint Node code
        run: npm run lint

      - name: Run Worker tests
        working-directory: assistant-proxy
        run: node --test worker.test.mjs

      # Guards on the importer CLI: dry-run default, fixed destinations,
      # --limit refused against production, confirmations required. These
      # never touch a network.
      - name: Run source-pack importer guard tests
        run: node --test scripts/import_source_pack.test.mjs

      # Static validation of the manual staging-import workflow: dispatch-only
      # trigger, minimal permissions, SHA-pinned actions, confirmations before
      # auth, and no path to the production collection.
      - name: Validate staging-import workflow safety gates
        run: node --test .github/workflows/staging_import_workflow.test.mjs

      # The retirement tool is the only script here that can DELETE a
      # production document. These assert the ordering (every copy made and
      # verified before the first delete), the manifest allowlist, and that
      # no request ever leaves Firestore for Cloud Storage.
      - name: Run legacy-retirement guard tests
        run: node --test scripts/retire_legacy_records.test.mjs

      - name: Validate legacy-retirement workflow safety gates
        run: node --test .github/workflows/legacy_retirement_workflow.test.mjs

      # Static validation of the manual production-reconcile workflow. It
      # points a credential at the PRODUCTION collection, so the gates matter
      # more here than anywhere else: dispatch-only, main-only, its own
      # protected environment, four confirmations before auth, the read-only
      # service account rather than the write-capable staging one, and no
      # --write, delete, deploy or Storage call anywhere in the file.
      - name: Validate production-reconcile workflow safety gates
        run: node --test .github/workflows/production_reconcile_workflow.test.mjs

  firestore-rules-tests:
    name: Firestore and Storage security rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.0.0 — same commit the credential-bearing
      # workflows already run with `node-version: "20"`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      # The Firestore emulator is a Java process.
      # actions/setup-java v4.9.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      # `npm ci` (not `npm install`) — installs exactly the committed
      # package-lock.json and fails loudly if package.json and the lockfile
      # ever drift apart, so CI stays deterministic.
      - name: Install rules-test dependencies
        working-directory: test_firestore_rules
        run: npm ci --no-audit --no-fund
      # `firebase emulators:exec` boots the emulator, runs the suite, and
      # tears it down — no long-lived emulator and no real project involved.
      # Runs BOTH suites behind one emulator start: firestore.rules and
      # storage.rules. The Storage suite is what stops a signed-in pilgrim
      # overwriting the audio of a dua.
      - name: Run Firestore and Storage rules tests
        working-directory: test_firestore_rules
        run: npm test

  web-boot-smoke:
    name: Web boot smoke check (no blank page)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # subosito/flutter-action v2.14.0
      - name: Set up Flutter
        uses: subosito/flutter-action@1c5eb12d812966ca84680edc38353a0851c8fd56
        with:
          flutter-version: "3.24.2"
          channel: "stable"
          cache: true

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Install dependencies
        run: flutter pub get

      # --no-web-resources-cdn is what stops CanvasKit being fetched from
      # gstatic at runtime. The smoke check asserts it took effect, so a
      # release build that drops the flag fails here.
      - name: Build web (CanvasKit self-hosted)
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=ASSISTANT_PROXY_URL=https://example.invalid/assistant

      - name: Install smoke-check dependencies
        working-directory: test_web_boot
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: test_web_boot
        run: npx --yes playwright@1.49.1 install --with-deps chromium

      # Blocks gstatic and proves the page never sits silently blank: either
      # the app reports a first frame, or a bilingual failure screen with a
      # retry button is shown. Also proves CanvasKit came from our own origin.
      - name: Run boot smoke check
        working-directory: test_web_boot
        run: npm run smoke

# ── Action pinning ─────────────────────────────────────────────────
#
# Every action above is pinned to a full commit SHA, with the release it
# corresponds to in the comment beside it. A tag is mutable — whoever controls
# the action's repository can repoint it at other code, and this workflow
# would run that code without the diff ever showing a change.
#
# Each SHA was resolved from the action's own repository with
# `git ls-remote --tags`, not copied from another file. That matters: the
# comment on the checkout SHA used to read "v4.2.2" and was simply wrong —
# 3d3c42e5 is v7.0.1. A version comment nobody verifies is worse than none,
# because it is trusted.
#
# For the two annotated-tag repositories, the pinned value is the commit the
# tag dereferences to (`refs/tags/vX^{}`), not the tag object.
#
# To move a pin, resolve the new tag the same way and update both the SHA and
# its comment together:
#
#   git ls-remote --tags https://github.com/<owner>/<repo> | grep 'refs/tags/vX.Y.Z'
