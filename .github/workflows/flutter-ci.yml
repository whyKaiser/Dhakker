name: Flutter CI

on:
  push:
    branches:
      - "main"
      - "claude/dhakker-context-ai-upgrade-v0ilmk"
      - "claude/moia-umrah-source-pack"
      - "claude/quran-text-authority-u5-u12"
      - "claude/import-staging-guards"
      - "claude/importer-field-schema"
      - "claude/staging-import-workflow"
      - "claude/language-routing-audit"
      - "claude/staging-collection-rules"
      - "claude/human-review-ledger"
      - "claude/usage-qualifier-optional-addition"
      - "claude/content-kind-contextual-evidence"
      - "claude/batch-c-review"
      - "claude/batch-d-review"
      - "claude/batch-e-review"
      - "claude/high-risk-content-audit"
      - "claude/remaining-guidance-review"
      - "claude/guidance-g1-g2-g4-g7"
      - "claude/remaining-general-review"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.2"
          channel: "stable"
          cache: true

      # This repo's pre-existing files were never run through `dart format`
      # on a case-sensitive filesystem, so `dart format .` across the whole
      # tree fails on ~60 files unrelated to this feature. Until the whole
      # repo is formatted in its own dedicated change, only check the Dart
      # files this feature fully owns (new files, or files where every line
      # in the diff is this feature's own addition) — this must still fail
      # if any of them is incorrectly formatted. Files where this feature
      # only inserted a small, surgical diff into a pre-existing, not-yet-
      # formatted file (lib/bloc/cubit.dart, home_dua_controller.dart) are
      # deliberately excluded: formatting them would force an unrelated
      # full-file reflow, which is exactly what this check exists to avoid.
      - name: Verify formatting (feature-owned files only)
        run: |
          FEATURE_DART_FILES=(
            "lib/Screens/Assistant/assistant_screen.dart"
            "lib/Screens/Piligram/Duas/widgets/content_kind_card.dart"
            "lib/Screens/Piligram/Home/models/supplication_model.dart"
            "test/content_kind_classification_test.dart"
            "test/source_pack_integrity_test.dart"
            "test/quran_text_authority_test.dart"
            "test/no_bundled_third_party_test.dart"
            "lib/data/offline_knowledge_repository.dart"
            "lib/services/assistant_service.dart"
            "lib/services/language_policy.dart"
            "test/language_policy_test.dart"
            "lib/services/pilgrim_context_builder.dart"
            "test/assistant_response_widget_test.dart"
            "test/assistant_service_test.dart"
            "test/offline_knowledge_repository_test.dart"
            "test/review_ledger_test.dart"
            "test/usage_qualifier_test.dart"
            "test/supplication_writers_test.dart"
            "test/content_kind_batch_b_test.dart"
            "test/quran_authority_coverage_test.dart"
            "test/source_references_test.dart"
            "test/recitation_policy_test.dart"
            "test/safa_trigger_gap_test.dart"
            "test/marwah_relation_test.dart"
            "test/high_risk_content_test.dart"
            "test/guidance_batches_g3_g5_g6_test.dart"
            "test/guidance_batches_g1_g2_g4_test.dart"
            "test/page_97_general_duas_test.dart"
            "test/halq_shamil_citation_test.dart"
            "test/page_98_and_g7_batch_test.dart"
            "test/tamam_umrah_test.dart"
            "test/page_99_test.dart"
            "test/page_100_test.dart"
            "test/page_101_test.dart"
            "test/page_102_test.dart"
            "test/page_64_test.dart"
            "test/takhrij_review_test.dart"
            "lib/Screens/Piligram/Home/services/dua_playback_service.dart"
            "test/dua_playback_fallback_test.dart"
          )
          dart format --output=none --set-exit-if-changed "${FEATURE_DART_FILES[@]}"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  worker-tests:
    name: Assistant proxy Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Worker tests
        working-directory: assistant-proxy
        run: node --test worker.test.mjs

      # Guards on the importer CLI: dry-run default, fixed destinations,
      # --limit refused against production, confirmations required. These
      # never touch a network.
      - name: Run source-pack importer guard tests
        run: node --test scripts/import_source_pack.test.mjs

      # Static validation of the manual staging-import workflow: dispatch-only
      # trigger, minimal permissions, SHA-pinned actions, confirmations before
      # auth, and no path to the production collection.
      - name: Validate staging-import workflow safety gates
        run: node --test .github/workflows/staging_import_workflow.test.mjs

  firestore-rules-tests:
    name: Firestore security rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # `npm ci` (not `npm install`) — installs exactly the committed
      # package-lock.json and fails loudly if package.json and the lockfile
      # ever drift apart, so CI stays deterministic.
      - name: Install rules-test dependencies
        working-directory: test_firestore_rules
        run: npm ci --no-audit --no-fund
      # `firebase emulators:exec` boots the emulator, runs the suite, and
      # tears it down — no long-lived emulator and no real project involved.
      - name: Run Firestore rules tests
        working-directory: test_firestore_rules
        run: npm test
