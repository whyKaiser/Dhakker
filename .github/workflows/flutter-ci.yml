name: Flutter CI

on:
  push:
    branches:
      - "claude/dhakker-context-ai-upgrade-v0ilmk"
  pull_request:
    branches:
      - "claude/dhakker-context-ai-upgrade-v0ilmk"

jobs:
  analyze-and-test:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.2"
          channel: "stable"
          cache: true

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  worker-tests:
    name: Assistant proxy Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Worker tests
        working-directory: assistant-proxy
        run: node --test worker.test.mjs
